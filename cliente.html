<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Cliente - WebLocal Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN CLIENTE -->
    <div id="login-cliente" class="login-screen">
        <div class="login-box">
            <div class="logo" style="justify-content:center;margin-bottom:20px">
                <span class="logo-icon">🌐</span>
                <span class="logo-text">WebLocal<span class="logo-pro">Pro</span></span>
            </div>
            <h2>Portal del Cliente</h2>
            <p style="text-align:center;color:#666;margin-bottom:20px">Accede con el código que te proporcioné</p>
            <form id="form-login-cliente">
                <div class="form-group">
                    <label>Código de acceso</label>
                    <input type="text" id="codigo-acceso" placeholder="ej: barberia123" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Acceder</button>
                <p id="login-cliente-error" style="display:none;color:var(--danger);text-align:center;margin-top:10px">❌ Código incorrecto</p>
            </form>
        </div>
    </div>

    <!-- PORTAL CLIENTE -->
    <div id="portal-cliente" style="display:none">
        <header style="background:var(--primary);padding:20px;color:white;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
            <div class="logo">
                <span class="logo-icon">🌐</span>
                <span class="logo-text" style="color:white">WebLocal<span class="logo-pro" style="color:var(--secondary)">Pro</span></span>
            </div>
            <h2 id="cliente-bienvenida" style="font-size:1.1rem;opacity:0.9"></h2>
            <button class="btn btn-outline btn-sm" onclick="cerrarSesionCliente()">Cerrar sesión</button>
        </header>

        <div style="max-width:1000px;margin:0 auto;padding:30px 20px">

            <!-- INFO DE SU WEB -->
            <div class="cliente-web-info" id="cliente-web-info"></div>

            <!-- CHAT -->
            <div class="cliente-chat-box">
                <h3>💬 Chat con soporte</h3>
                <p style="color:#666;font-size:0.9rem;margin-bottom:15px">Escríbeme cualquier duda o incidencia. Respondo en menos de 24h.</p>
                <div class="chat-mensajes" id="chat-mensajes-cliente">
                    <div style="text-align:center;color:#999;padding:20px">No hay mensajes aún. ¡Escríbeme!</div>
                </div>
                <form id="form-chat-cliente" class="chat-input-box">
                    <input type="text" id="chat-input-cliente" placeholder="Escribe tu mensaje..." required>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>

        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
